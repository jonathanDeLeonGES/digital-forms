name: CI/CD

on:
  pull_request:
    branches: [master, main, scenario/df-11-responsable-temporal-boundary]
  push:
    branches: [master, main, scenario/df-11-responsable-temporal-boundary]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sgca
          POSTGRES_USER: sgca
          POSTGRES_PASSWORD: sgca_dev_password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sgca -d sgca"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 5
    env:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DJANGO_SECRET_KEY: ci-secret-key
      DB_NAME: sgca
      DB_USER: sgca
      DB_PASSWORD: sgca_dev_password
      DB_HOST: localhost
      DB_PORT: 5432
      TENANT_BASE_DOMAIN: localhost
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: pip install -r requirements/dev.txt
      - name: Lint (ruff)
        run: ruff check .
      - name: Aplicar migraciones del schema publico
        run: python manage.py migrate_schemas --shared
      - name: Ejecutar tests
        run: pytest --maxfail=1 -q

  frontend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npm run build
      - run: npm test

  compose-verification:
    # DF-58: levanta el stack de Docker Compose del proyecto y verifica por
    # HTTP (con datos desechables) que un responsable temporal puede iniciar
    # una acción el último día de su asignación, además de correr la
    # regresión pytest dentro del contenedor del backend.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Preparar entorno local sin credenciales externas
        run: |
          grep -E '^(DJANGO_|DB_|TENANT_BASE_DOMAIN=|REDIS_URL=)' .env.dev > .env.dev.ci
          mv .env.dev.ci .env.dev
      - name: Iniciar Docker Compose
        run: docker compose -p df58ci up -d --build db redis minio minio-init backend
      - name: Esperar backend listo
        run: |
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
              -H 'Content-Type: application/json' -d '{}' \
              http://localhost:8000/api/public/tenants/register/ || true)
            [ "$code" = "400" ] && echo "backend listo" && exit 0
            sleep 2
          done
          echo "backend no respondió a tiempo" && exit 1
      - name: Regresión pytest DF-58 dentro del contenedor
        run: |
          mkdir -p evidence
          docker compose -p df58ci exec -T backend pytest apps/acciones/tests -k df58 -q \
            2>&1 | tee evidence/pytest-df58.txt
      - name: Verificación HTTP DF-58 (Docker Compose)
        run: |
          EVIDENCE_FILE=evidence/http-df58.json \
            python3 postman/verify_df58_responsable_temporal.py \
            2>&1 | tee evidence/http-df58.txt
      - name: Recopilar logs de Compose
        if: always()
        run: |
          mkdir -p evidence
          docker compose -p df58ci ps -a > evidence/compose-status.txt || true
          docker compose -p df58ci logs --no-color backend > evidence/backend.log 2>&1 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: df58-compose-evidence
          path: evidence/
          retention-days: 14
      - name: Limpiar entorno desechable
        if: always()
        run: docker compose -p df58ci down --volumes --remove-orphans

  notify-pr:
    if: github.event_name == 'pull_request'
    needs: [backend-tests, frontend-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Notificar a Slack
        run: |
          if [ -z "${SLACK_WEBHOOK_URL}" ]; then
            echo "SLACK_WEBHOOK_URL no configurado, se omite notificacion."
            exit 0
          fi
          curl -sf -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\"PR #${{ github.event.pull_request.number }} '${{ github.event.pull_request.title }}' - CI en verde, lista para revision/deploy.\"}" \
            "${SLACK_WEBHOOK_URL}"
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  docker-build:
    needs: [backend-tests, frontend-tests, compose-verification]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t digital-forms-backend:${{ github.sha }} ./backend
      - name: Build frontend image
        run: docker build -t digital-forms-frontend:${{ github.sha }} ./frontend

  deploy:
    needs: [docker-build]
    # DF-58: la rama del escenario actúa como rama base del ticket, por lo
    # que el push del merge también dispara el job de deploy.
    if: (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/scenario/df-11-responsable-temporal-boundary') && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - name: Deploy
        run: |
          echo "TODO: reemplazar este paso con el deploy real (registry + ECS/K8s/VM/App Service)."
          echo "Aqui se asumen credenciales de despliegue como secrets del repo."
      - name: Notificar a Slack (resultado del deploy)
        if: always()
        run: |
          if [ -z "${SLACK_WEBHOOK_URL}" ]; then
            echo "SLACK_WEBHOOK_URL no configurado, se omite notificacion."
            exit 0
          fi
          STATUS="${{ job.status }}"
          curl -sf -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\"Deploy ${STATUS} para digital-forms @ ${{ github.sha }}\"}" \
            "${SLACK_WEBHOOK_URL}"
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
