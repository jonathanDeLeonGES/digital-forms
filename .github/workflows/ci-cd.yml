name: CI/CD

on:
  pull_request:
    branches: [master, main, scenario/df-11-responsable-temporal-boundary]
  push:
    branches: [master, main, scenario/df-11-responsable-temporal-boundary]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sgca
          POSTGRES_USER: sgca
          POSTGRES_PASSWORD: sgca_dev_password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sgca -d sgca"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 5
    env:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DJANGO_SECRET_KEY: ci-secret-key
      DB_NAME: sgca
      DB_USER: sgca
      DB_PASSWORD: sgca_dev_password
      DB_HOST: localhost
      DB_PORT: 5432
      TENANT_BASE_DOMAIN: localhost
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: pip install -r requirements/dev.txt
      - name: Lint (ruff)
        run: ruff check .
      - name: Aplicar migraciones del schema publico
        run: python manage.py migrate_schemas --shared
      - name: Ejecutar tests
        run: pytest --maxfail=1 -q

  frontend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npm run build
      - run: npm test

  compose-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Preparar entorno local sin credenciales externas
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.env.dev')
          prefixes = ('DJANGO_', 'DB_', 'TENANT_BASE_DOMAIN=', 'REDIS_URL=')
          lines = [line for line in path.read_text().splitlines() if line.startswith(prefixes)]
          path.write_text('\n'.join(lines) + '\n')
          PY
      - name: Iniciar Docker Compose
        run: docker compose -p df57-ci up -d --build
      - name: Verificar DF-57 por HTTP con datos desechables
        shell: bash
        run: |
          mkdir -p evidence
          docker compose -p df57-ci exec -T backend pytest apps/acciones/tests -k temporary_assignment -q 2>&1 | tee evidence/pytest.txt
          python postman/verify_responsable_temporal.py 2>&1 | tee evidence/http.jsonl
      - name: Recopilar logs de Compose
        if: always()
        run: |
          mkdir -p evidence
          docker compose -p df57-ci ps -a > evidence/compose-status.txt
          docker compose -p df57-ci logs --no-color backend > evidence/backend.log 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: df57-compose-evidence
          path: evidence/
          retention-days: 14
      - name: Limpiar entorno desechable
        if: always()
        run: docker compose -p df57-ci down --volumes --remove-orphans

  notify-pr:
    if: always() && github.event_name == 'pull_request'
    needs: [backend-tests, frontend-tests, compose-regression]
    runs-on: ubuntu-latest
    steps:
      - name: Notificar a Slack
        run: |
          if [ -z "${SLACK_WEBHOOK_URL}" ]; then
            echo "SLACK_WEBHOOK_URL no configurado, se omite notificacion."
            exit 0
          fi
          python - <<'PY' > slack-message.json
          import json
          import os
          text = (
              f"PR #{os.environ['PR_NUMBER']}: {os.environ['PR_TITLE']}\n"
              f"Triage, correccion y evidencia: {os.environ['PR_URL']}\n"
              f"Backend: {os.environ['BACKEND_RESULT']}; "
              f"frontend: {os.environ['FRONTEND_RESULT']}; "
              f"reproduccion Docker Compose: {os.environ['COMPOSE_RESULT']}.\n"
              "Despliegue: no ejecutado (pull request)."
          )
          print(json.dumps({'text': text}))
          PY
          curl -sf -X POST -H 'Content-type: application/json' \
            --data-binary @slack-message.json "${SLACK_WEBHOOK_URL}"
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          BACKEND_RESULT: ${{ needs.backend-tests.result }}
          FRONTEND_RESULT: ${{ needs.frontend-tests.result }}
          COMPOSE_RESULT: ${{ needs.compose-regression.result }}

  docker-build:
    needs: [backend-tests, frontend-tests, compose-regression]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t digital-forms-backend:${{ github.sha }} ./backend
      - name: Build frontend image
        run: docker build -t digital-forms-frontend:${{ github.sha }} ./frontend

  deploy:
    needs: [docker-build]
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - name: Deploy
        run: |
          echo "TODO: reemplazar este paso con el deploy real (registry + ECS/K8s/VM/App Service)."
          echo "Aqui se asumen credenciales de despliegue como secrets del repo."
      - name: Notificar a Slack (resultado del deploy)
        if: always()
        run: |
          if [ -z "${SLACK_WEBHOOK_URL}" ]; then
            echo "SLACK_WEBHOOK_URL no configurado, se omite notificacion."
            exit 0
          fi
          STATUS="${{ job.status }}"
          curl -sf -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\"Deploy ${STATUS} para digital-forms @ ${{ github.sha }}\"}" \
            "${SLACK_WEBHOOK_URL}"
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
